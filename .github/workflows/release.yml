name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build

      - name: Install Desktop & Package Windows Portable EXE
        run: |
          cd desktop
          npm ci
          npm run build:exe

      - name: Create GitHub Release & Upload Windows EXE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating release for ${{ github.ref_name }}..."
          gh release create "${{ github.ref_name }}" \
            --title "Kalevala Zero ${{ github.ref_name }}" \
            --generate-notes || true

          for i in 1 2 3 4; do
            echo "Attempt $i uploading release asset..."
            if gh release upload "${{ github.ref_name }}" desktop/release/Kalevala-Zero-*.exe --clobber; then
              echo "Release asset uploaded successfully!"
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 10s..."
            sleep 10
          done
          echo "Failed to upload release asset after 4 attempts."
          exit 1
