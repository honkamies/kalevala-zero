name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client & Build Web Assets
        run: |
          cd client
          npm ci
          npm run build

      - name: Install Desktop & Package Windows Portable EXE
        run: |
          cd desktop
          npm ci
          npm run build:exe

      - name: Create GitHub Release & Upload Windows EXE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            echo "Attempt $i to publish release and upload asset..."
            if gh release create "${{ github.ref_name }}" desktop/release/Kalevala-Zero-*.exe \
              --title "Kalevala Zero ${{ github.ref_name }}" \
              --generate-notes \
              --clobber; then
              echo "Release published and asset uploaded successfully!"
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 10s..."
            sleep 10
          done
          echo "Failed to create release after 3 attempts."
          exit 1
