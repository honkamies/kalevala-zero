<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      .bg { fill: #07090e; }
      .safe-box { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 8,4; }
      .ui-zone { fill: rgba(15, 23, 42, 0.7); stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .focus-zone { fill: rgba(34, 211, 238, 0.05); stroke: #22d3ee; stroke-width: 2; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #cbd5e1; font-weight: bold; }
      .title { font-family: 'Cinzel Decorative', Georgia, serif; font-size: 28px; font-weight: bold; fill: #f59e0b; }
      .subtext { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" class="bg" />

  <!-- Header -->
  <text x="640" y="50" text-anchor="middle" class="title">KALEVALA REALM CAROUSEL & COVER ART (1280x720 // 16:9)</text>
  <text x="640" y="76" text-anchor="middle" class="subtext">Style: Akseli Gallen-Kallela Finnish National Romanticism + Cyberpunk Oil Painting</text>

  <!-- Safe Area (90% bounding box) -->
  <rect x="64" y="90" width="1152" height="580" rx="8" class="safe-box" />
  <text x="75" y="112" class="label" fill="#38bdf8">90% SAFE DISPLAY AREA</text>

  <!-- Central Visual Focal Point -->
  <rect x="240" y="130" width="800" height="420" rx="16" class="focus-zone" />
  <text x="640" y="320" text-anchor="middle" class="label" fill="#38bdf8" font-size="24px">MAIN MYTHOLOGICAL SCENE / LANDSCAPE HORIZON</text>
  <text x="640" y="350" text-anchor="middle" class="subtext">Place major focal point (e.g. Swan, Sampo, Monolith, River, Mountain) in this center rect</text>

  <!-- Lower Overlay Zone (Where HUD and Lore text renders in-game) -->
  <rect x="90" y="520" width="1100" height="130" rx="6" class="ui-zone" />
  <text x="110" y="550" class="label" fill="#f59e0b">IN-GAME UI OVERLAY ZONE (Realm Titles, Lore Verses & Stage Chips)</text>
  <text x="110" y="575" class="subtext">Keep critical high-contrast painting details above this zone to ensure readable UI contrast</text>

  <!-- Footer -->
  <text x="640" y="695" text-anchor="middle" class="subtext">Save to client/public/assets/carousel_[realm_id].jpg (e.g. carousel_tuonela.jpg)</text>
</svg>
